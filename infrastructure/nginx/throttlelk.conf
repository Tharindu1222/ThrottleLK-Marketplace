# ThrottleLK — same-origin TLS edge
# Copy to /etc/nginx/sites-available/throttlelk.conf and enable.
# Replace server_name and certificate paths.

upstream throttlelk_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream throttlelk_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.throttlelk.lk throttlelk.lk;
    return 301 https://www.throttlelk.lk$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.throttlelk.lk;

    ssl_certificate     /etc/letsencrypt/live/www.throttlelk.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.throttlelk.lk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/v1/ {
        proxy_pass http://throttlelk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://throttlelk_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name throttlelk.lk;

    ssl_certificate     /etc/letsencrypt/live/www.throttlelk.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.throttlelk.lk/privkey.pem;

    return 301 https://www.throttlelk.lk$request_uri;
}
