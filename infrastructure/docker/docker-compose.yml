services:
  postgres:
    image: postgres:16-alpine
    container_name: throttlelk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: throttlelk
      POSTGRES_PASSWORD: throttlelk
      POSTGRES_DB: throttlelk
    ports:
      - '5432:5432'
    volumes:
      - throttlelk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U throttlelk -d throttlelk']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  throttlelk_pg:
